services:
  # ── Web Service ────────────────────────────────────────────────
  - type: web
    name: xentinel
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: APP_NAME
        value: Xentinel
      - key: BASE_URL
        sync: false
      - key: FLASK_ENV
        value: production
      - key: MASTER_ADMIN_EMAIL
        sync: false
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL_V1
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_DEFAULT_MODEL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_STARTER
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_PRICE_ID_GROWTH
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OAUTH_GOOGLE_CLIENT_ID
        sync: false
      - key: OAUTH_GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_GITHUB_CLIENT_ID
        sync: false
      - key: OAUTH_GITHUB_CLIENT_SECRET
        sync: false
      - key: MONITOR_TICK_TOKEN
        sync: false
      - key: LEARNING_ENABLED
        value: "1"
      - key: DECISION_TOP_N
        value: "3"
      - key: POLICY_DEFAULT_MAX_RISK_LEVEL
        value: HIGH
      - key: DASH_CACHE_TTL_S
        value: "60"
    startCommand: bash bin/start_web.sh

  # ── Background Worker ──────────────────────────────────────────
  - type: worker
    name: xentinel-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL_V1
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_DEFAULT_MODEL
        sync: false
      - key: LEARNING_ENABLED
        value: "1"
      - key: POLICY_DEFAULT_MAX_RISK_LEVEL
        value: HIGH
    startCommand: python -m nexus.worker
